
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZORQUINT: CITY RISE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101d;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:manipulation}
header{height:64px;background:#101b2d;border-bottom:1px solid #29435c;display:flex;align-items:center;justify-content:space-between;padding:8px 13px}
.logo{font-size:19px;font-weight:900;letter-spacing:1px;color:#5ce8ff}
.sub{font-size:10px;color:#a9bbcf;margin-top:4px;letter-spacing:1px}
.stats{text-align:right;font-size:13px;line-height:1.8}
#stage{position:relative}
canvas{display:block;width:100%;height:calc(100dvh - 158px);touch-action:none}
#mission{position:absolute;top:10px;left:10px;padding:10px 12px;border:1px solid #45657c;background:#0a1426eF;border-radius:12px;font-size:12px;line-height:1.6;max-width:72%;pointer-events:none}
#mission strong{color:#5ce8ff;font-size:13px}
#help{position:absolute;right:9px;top:10px;background:#0a1426dd;padding:7px;border-radius:8px;font-size:10px;color:#c4d7e9}
#controls{height:94px;background:#0a1421;display:flex;align-items:center;justify-content:space-around;padding:5px 8px;gap:8px}
#pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,34px);gap:4px}
button{color:white;border:1px solid #3d607f;background:#172b42;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
.dir{border-radius:9px;font-size:18px}
.blank{visibility:hidden}
#missionBtn{height:62px;width:86px;border-radius:13px;background:#075c76;font-size:12px;line-height:1.4}
#jump{height:55px;width:55px;border-radius:50%;background:#4b3679;font-size:11px}
#toast{position:absolute;bottom:106px;left:50%;transform:translateX(-50%);background:#071523ee;border:1px solid #5ce8ff;border-radius:10px;padding:9px 12px;font-size:12px;display:none;white-space:nowrap;z-index:5}
</style>
</head>
<body>
<header>
 <div><div class="logo">ZORQUINT</div><div class="sub">CITY RISE · OPEN WORLD</div></div>
 <div class="stats">🪙 <span id="coins">0</span> coins<br>MISSIONS <span id="count">0</span>/5</div>
</header>
<div id="stage">
 <canvas id="game"></canvas>
 <div id="mission"><strong>🎯 CITY MISSION</strong><br><span id="task">Reach Central Station</span><br>Follow the glowing marker.</div>
 <div id="help">CITY MAP<br>EXPLORE</div>
 <div id="toast"></div>
</div>
<div id="controls">
 <div id="pad">
  <button class="dir blank">•</button><button class="dir" data-key="up">▲</button><button class="dir blank">•</button>
  <button class="dir" data-key="left">◀</button><button class="dir" data-key="down">▼</button><button class="dir" data-key="right">▶</button>
 </div>
 <button id="jump">DASH</button>
 <button id="missionBtn">MISSION<br>INFO</button>
</div>
<script>
(function(){
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight-158,dpr=1;
const WORLD=2640,STEP=220,ROAD=48;
function resize(){
 const r=canvas.getBoundingClientRect();
 dpr=Math.min(devicePixelRatio||1,2);
 W=r.width;H=r.height;
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const savedCoins=Number(localStorage.getItem("zq_city_coins")||0);
let coins=savedCoins;
let completed=Number(localStorage.getItem("zq_city_missions")||0);
completed=Math.max(0,Math.min(5,completed));
const player={x:1124,y:1124,r:11,speed:3.1};
const missions=[
 {x:1124,y:904,name:"Reach Central Station"},
 {x:1564,y:1124,name:"Visit Neon Market"},
 {x:1124,y:1564,name:"Explore Riverside"},
 {x:684,y:1124,name:"Find Old Town"},
 {x:684,y:684,name:"Complete City Tour"}
];
let target=missions[Math.min(completed,4)];
let keys={};
let dash=0;
const buildings=[];
const parks=[];
for(let y=60;y<WORLD-100;y+=STEP){
 for(let x=60;x<WORLD-100;x+=STEP){
  const roll=(Math.floor(x/STEP)*7+Math.floor(y/STEP)*11)%9;
  if(roll===0){
   parks.push({x:x,y:y,w:130,h:130});
  }else{
   buildings.push({
    x:x+4+(roll%3)*5,y:y+4+(roll%2)*6,
    w:112+(roll%4)*7,h:112+((roll+2)%4)*6,
    color:["#30475e","#374356","#354e53","#42415b"][roll%4],
    name:roll%3===0?"TOWER":""
   });
  }
 }
}
function blocked(x,y){
 for(const b of buildings){
  if(x+player.r>b.x&&x-player.r<b.x+b.w&&
     y+player.r>b.y&&y-player.r<b.y+b.h)return true;
 }
 return false;
}
function setKey(k,v){keys[k]=v}
document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();setKey(k,true);
  if(btn.setPointerCapture)btn.setPointerCapture(e.pointerId);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  btn.addEventListener(ev,e=>{e.preventDefault();setKey(k,false)})
);
});
addEventListener("keydown",e=>{
 const map={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};
 if(map[e.key]){e.preventDefault();setKey(map[e.key],true)}
});
addEventListener("keyup",e=>{
 const map={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};
 if(map[e.key])setKey(map[e.key],false)
});
addEventListener("blur",()=>{keys={}});
function toast(s){
 const el=document.getElementById("toast");
 el.textContent=s;el.style.display="block";
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>el.style.display="none",2100);
}
function updateLabels(){
 document.getElementById("coins").textContent=coins;
 document.getElementById("count").textContent=completed;
 document.getElementById("task").textContent=completed>=5?
 "All missions complete! Explore the city freely.":target.name;
}
document.getElementById("missionBtn").onclick=()=>{
 toast(completed>=5?"🏆 CITY TOUR COMPLETED!":"🎯 "+target.name);
};
document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();dash=28;toast("⚡ DASH!");
});
function update(){
 let dx=(keys.right?1:0)-(keys.left?1:0);
 let dy=(keys.down?1:0)-(keys.up?1:0);
 if(dx&&dy){dx*=0.7071;dy*=0.7071}
 const speed=player.speed+(dash>0?2.4:0);
 if(dash>0)dash--;
 const nx=Math.max(player.r,Math.min(WORLD-player.r,player.x+dx*speed));
 const ny=Math.max(player.r,Math.min(WORLD-player.r,player.y+dy*speed));
 if(!blocked(nx,player.y))player.x=nx;
 if(!blocked(player.x,ny))player.y=ny;
 if(completed<5&&Math.hypot(player.x-target.x,player.y-target.y)<37){
  completed++;coins+=100;
  localStorage.setItem("zq_city_coins",coins);
  localStorage.setItem("zq_city_missions",completed);
  target=missions[Math.min(completed,4)];
  updateLabels();
  toast("MISSION COMPLETE! +100 COINS 🪙");
 }
}
function drawRoads(){
 ctx.fillStyle="#26333c";ctx.fillRect(0,0,WORLD,WORLD);
 // city blocks have open roads between buildings
 ctx.fillStyle="#303944";
 for(let p=0;p<WORLD;p+=STEP){
  ctx.fillRect(p,0,ROAD,WORLD);
  ctx.fillRect(0,p,WORLD,ROAD);
 }
 ctx.strokeStyle="#b8b69b";ctx.lineWidth=2;ctx.setLineDash([14,15]);
 for(let p=ROAD/2;p<WORLD;p+=STEP){
  ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,WORLD);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(WORLD,p);ctx.stroke();
 }
 ctx.setLineDash([]);
}
function render(){
 update();
 const camX=Math.max(0,Math.min(WORLD-W,player.x-W/2));
 const camY=Math.max(0,Math.min(WORLD-H,player.y-H/2));
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(-camX,-camY);
 drawRoads();

 for(const p of parks){
  ctx.fillStyle="#21483d";ctx.fillRect(p.x,p.y,p.w,p.h);
  for(let i=0;i<5;i++){
   const tx=p.x+18+i*23,ty=p.y+25+(i%2)*42;
   ctx.fillStyle="#3c7853";ctx.beginPath();ctx.arc(tx,ty,9,0,7);ctx.fill();
   ctx.fillStyle="#8a714d";ctx.fillRect(tx-2,ty,4,12);
  }
 }
 for(const b of buildings){
  ctx.fillStyle="#101923";ctx.fillRect(b.x+8,b.y+9,b.w,b.h);
  ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle="#65dce3";
  for(let x=b.x+11;x<b.x+b.w-7;x+=20){
   for(let y=b.y+12;y<b.y+b.h-7;y+=22){
    ctx.fillRect(x,y,8,9);
   }
  }
  ctx.fillStyle="#516473";ctx.fillRect(b.x+b.w/2-8,b.y+b.h/2-8,16,16);
 }
 // mission marker
 if(completed<5){
  const pulse=17+Math.sin(Date.now()/180)*6;
  ctx.beginPath();ctx.arc(target.x,target.y,pulse+8,0,7);
  ctx.strokeStyle="#54f4ff";ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.arc(target.x,target.y,10,0,7);
  ctx.fillStyle="#54f4ff";ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.textAlign="center";
  ctx.fillText("MISSION",target.x,target.y-32);
 }
 // player shadow and character
 ctx.fillStyle="#1118";ctx.beginPath();ctx.ellipse(player.x,player.y+9,14,8,0,0,7);ctx.fill();
 ctx.fillStyle="#f5b85d";ctx.beginPath();ctx.arc(player.x,player.y,11,0,7);ctx.fill();
 ctx.fillStyle="#17263a";ctx.fillRect(player.x-5,player.y-3,10,7);
 ctx.fillStyle="#fff";ctx.font="bold 12px Arial";ctx.textAlign="center";
 ctx.fillText("YOU",player.x,player.y-20);
 ctx.restore();

 // mini map
 const mw=86,mh=86,mx=W-mw-10,my=H-mh-10;
 ctx.fillStyle="#07111de8";ctx.fillRect(mx,my,mw,mh);
 ctx.strokeStyle="#61eaff";ctx.lineWidth=1.5;ctx.strokeRect(mx,my,mw,mh);
 ctx.fillStyle="#536a77";
 for(const b of buildings){
  ctx.fillRect(mx+b.x/WORLD*mw,my+b.y/WORLD*mh,3,3);
 }
 if(completed<5){
  ctx.fillStyle="#55f5ff";ctx.beginPath();
  ctx.arc(mx+target.x/WORLD*mw,my+target.y/WORLD*mh,3,0,7);ctx.fill();
 }
 ctx.fillStyle="#ffcb70";ctx.beginPath();
 ctx.arc(mx+player.x/WORLD*mw,my+player.y/WORLD*mh,3,0,7);ctx.fill();
 requestAnimationFrame(render);
}
updateLabels();
toast("Welcome to ZORQUINT CITY!");
render();
})();
</script>
</body>
</html>
