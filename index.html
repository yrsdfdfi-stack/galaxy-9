<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEONFLIX — Watch Movies</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  background:#05060c;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 24px;
  background:linear-gradient(180deg,#05060cf2,#05060c00);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:26px;font-weight:900;
  color:#ff2e63;
  text-shadow:0 0 18px #ff2e6388;
}

.logo span{color:#00e5ff}

.hero{
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:90px 20px 40px;
  background:
    radial-gradient(circle at 70% 25%,#3b1a5e,#05060c 70%);
}

.badge{
  background:#ff2e63;
  padding:6px 16px;
  border-radius:30px;
  font-size:12px;font-weight:bold;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(36px,8vw,70px);
  font-weight:900;
  line-height:1.1;
  text-shadow:0 0 30px #00e5ff55;
}

.hero h1 span{color:#00e5ff}

.hero p{
  margin:18px 0 26px;
  color:#b8c7d6;
  font-size:15px;
  max-width:520px;
  line-height:1.7;
}

video{
  width:100%;
  max-width:900px;
  border-radius:18px;
  border:1px solid #ffffff22;
  box-shadow:0 25px 60px #000000aa;
  background:#000;
}

section{
  padding:60px 6vw;
}

.section-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:24px;
}

.section-head h2{font-size:24px}

.section-head a{
  color:#00e5ff;font-size:14px;text-decoration:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:18px;
}

.card{
  background:#0c1420;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #ffffff12;
  transition:.25s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:#00e5ff66;
}

.card video{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:0;
  border:none;
  box-shadow:none;
  background:#000;
}

.card-info{
  padding:12px;
}

.card-info h3{
  font-size:15px;margin-bottom:5px;
}

.card-info p{
  font-size:12px;color:#8fa3b5;
}

.rating{color:#ffd166;font-weight:bold}

footer{
  padding:45px 6vw;
  background:#04050a;
  border-top:1px solid #ffffff10;
  text-align:center;
  color:#7d8fa0;
  font-size:13px;
  line-height:1.8;
}

footer b{color:#fff}
</style>
</head>

<body>

<nav>
  <div class="logo">NEON<span>FLIX</span></div>
</nav>

<!-- MAIN VIDEO -->
<div class="hero">
  <div class="badge">🔥 NOW PLAYING</div>

  <h1>NEON<br><span>CITY</span> 2077</h1>

  <p>
    तुमचा खरा movie trailer / video खाली प्ले करा.
  </p>

  <video
    controls
    playsinline
    poster=""
    src="https://raw.githubusercontent.com/yrsdfdfi-stack/galaxy-9/main/VID_20261003_185033_544.mp4"
  ></video>
</div>

<!-- MORE VIDEOS -->
<section>
  <div class="section-head">
    <h2>🎬 More Videos</h2>
    <a href="#">View All</a>
  </div>

  <div class="grid">

    <div class="card">
      <video
        controls
        playsinline
        src="https://raw.githubusercontent.com/yrsdfdfi-stack/galaxy-9/main/VID_20261003_185033_544.mp4"
      ></video>

      <div class="card-info">
        <h3>My First Video</h3>
        <p><span class="rating">★ NEW</span> · Uploaded Video</p>
      </div>
    </div>

    <div class="card">
      <video
        controls
        playsinline
        src="https://raw.githubusercontent.com/yrsdfdfi-stack/galaxy-9/main/VID_20261003_185033_544.mp4"
      ></video>

      <div class="card-info">
        <h3>Neon City Trailer</h3>
        <p><span class="rating">★ 8.9</span> · Sci-Fi</p>
      </div>
    </div>

    <div class="card">
      <video
        controls
        playsinline
        src="https://raw.githubusercontent.com/yrsdfdfi-stack/galaxy-9/main/VID_20261003_185033_544.mp4"
      ></video>

      <div class="card-info">
        <h3>Action Clip</h3>
        <p><span class="rating">★ 8.4</span> · Action</p>
      </div>
    </div>

  </div>
</section>

<footer>
  <b>NEONFLIX</b><br>
  Watch your uploaded videos online.
</footer>

</body>
</html>
