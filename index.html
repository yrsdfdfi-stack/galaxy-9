<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON DRIFT 3D</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;background:#02040a;color:#fff;
  font-family:Arial,sans-serif;touch-action:none;
  user-select:none;-webkit-user-select:none;
}

canvas{display:block;width:100vw;height:100dvh;touch-action:none}

#top{
  position:fixed;top:0;left:0;right:0;
  padding:12px 16px;display:flex;
  justify-content:space-between;z-index:10;
  font-weight:bold;text-shadow:0 0 10px #00e5ff;
}

#score{color:#00e5ff;font-size:22px}
#best{color:#ffd166;font-size:15px;text-align:right}

#speed{
  position:fixed;top:64px;left:16px;z-index:10;
  font-size:14px;color:#9ff;font-weight:bold;
  text-shadow:0 0 8px #00e5ff;
}

#start{
  position:fixed;inset:0;z-index:30;
  background:radial-gradient(circle at center,#0b1d33,#02040a);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  text-align:center;padding:24px;
}

#start h1{
  font-size:42px;margin:0;color:#00e5ff;
  text-shadow:0 0 25px #00e5ff,0 0 60px #0077ff;
}

#start p{
  color:#b9d6e8;font-size:15px;line-height:1.6;
  max-width:330px;
}

#play{
  margin-top:26px;padding:16px 44px;
  font-size:20px;font-weight:900;color:#021018;
  background:linear-gradient(90deg,#00e5ff,#7cffcb);
  border:none;border-radius:40px;
  box-shadow:0 0 30px #00e5ff88;
}

#over{
  position:fixed;inset:0;z-index:30;display:none;
  background:#02040ae8;
  flex-direction:column;justify-content:center;
  align-items:center;text-align:center;
}

#over h1{color:#ff4d6d;font-size:38px;text-shadow:0 0 25px #ff4d6d}
#over p{font-size:18px;color:#d8f6ff}

#again{
  margin-top:22px;padding:14px 38px;
  font-size:18px;font-weight:900;color:#021018;
  background:linear-gradient(90deg,#ffd166,#ff8fa3);
  border:none;border-radius:40px;
  box-shadow:0 0 25px #ffd16677;
}

#controls{
  position:fixed;bottom:0;left:0;right:0;
  height:200px;display:none;
  justify-content:space-evenly;align-items:center;
  z-index:20;padding-bottom:22px;
  background:linear-gradient(180deg,transparent,#01050bcc);
}

.cbtn{
  width:140px;height:140px;border-radius:50%;
  font-size:58px;font-weight:bold;color:#fff;
  background:linear-gradient(180deg,#123a5c,#081c2f);
  border:3px solid #2f6d94;
  box-shadow:0 0 30px #00e5ff55;
  touch-action:none;user-select:none;
  -webkit-user-select:none;
}

.cbtn:active{
  background:linear-gradient(180deg,#0a9dbf,#066b85);
  border-color:#7ff4ff;
  transform:scale(0.95);
}
</style>
</head>

<body>

<div id="top">
  <div id="score">SCORE 0</div>
  <div id="best">BEST 0</div>
</div>

<div id="speed">SPEED 0 KM/H</div>

<div id="start">
  <h1>NEON DRIFT 3D</h1>
  <p>
    सुरुवातीला गाडी हळू चालेल.<br>
    नंतर स्पीड वाढेल आणि रहदारीही जास्त होईल.<br>
    टक्कर टाळून जास्त score करा!
  </p>
  <button id="play">START RACE</button>
</div>

<div id="over">
  <h1>CRASHED!</h1>
  <p id="finalScore">SCORE 0</p>
  <button id="again">PLAY AGAIN</button>
</div>

<div id="controls">
  <button class="cbtn" id="left">◀</button>
  <button class="cbtn" id="right">▶</button>
</div>

<canvas id="game"></canvas>

<script>
(() => {

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1, 2);

function resize(){
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize", resize);
resize();

let playing = false;
let playerX = 0;
let speed = 0;
let distance = 0;
let score = 0;
let best = Number(localStorage.getItem("neonBest") || 0);

let obstacles = [];
let stars = [];
let lines = [];

const maxSpeed = 26;

for(let i=0;i<90;i++){
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.55,
    s: Math.random() * 2 + 0.5
  });
}

for(let i=0;i<40;i++){
  lines.push(i / 40);
}

/* ---------- SOUND ---------- */

let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let engineFilter = null;

function startAudio(){
  if(audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  engineOsc = audioCtx.createOscillator();
  engineOsc.type = "sawtooth";
  engineOsc.frequency.value = 50;

  engineFilter = audioCtx.createBiquadFilter();
  engineFilter.type = "lowpass";
  engineFilter.frequency.value = 500;

  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0.0001;

  engineOsc.connect(engineFilter);
  engineFilter.connect(engineGain);
  engineGain.connect(audioCtx.destination);

  engineOsc.start();
}

function updateEngineSound(){
  if(!audioCtx || !playing) return;

  const freq = 45 + speed * 8;
  const volume = 0.025 + (speed / maxSpeed) * 0.07;

  engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
  engineGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.12);
}

function stopEngineSound(){
  if(!audioCtx || !engineGain) return;
  engineGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1);
}

function crashSound(){
  if(!audioCtx) return;

  const bufferSize = audioCtx.sampleRate * 0.6;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for(let i=0;i<bufferSize;i++){
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 900;

  const gain = audioCtx.createGain();
  gain.gain.value = 0.55;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();

  const boom = audioCtx.createOscillator();
  const boomGain = audioCtx.createGain();

  boom.type = "sine";
  boom.frequency.setValueAtTime(120, audioCtx.currentTime);
  boom.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.5);

  boomGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
  boomGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

  boom.connect(boomGain);
  boomGain.connect(audioCtx.destination);

  boom.start();
  boom.stop(audioCtx.currentTime + 0.6);
}

/* ---------- GAME ---------- */

function reset(){
  playerX = 0;
  speed = 0;
  distance = 0;
  score = 0;
  obstacles = [];

  // सुरुवातीला फक्त 2 अडथळे
  addObstacle(1400);
  addObstacle(2200);
}

function addObstacle(z){
  obstacles.push({
    z: z,
    lane: Math.floor(Math.random() * 3) - 1,
    color: ["#ff4d6d","#ffd166","#8f6bff","#41ffb0"][Math.floor(Math.random()*4)]
  });
}

function startGame(){
  startAudio();

  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  reset();
  playing = true;

  document.getElementById("start").style.display = "none";
  document.getElementById("over").style.display = "none";
  document.getElementById("controls").style.display = "flex";
}

function crash(){
  playing = false;
  stopEngineSound();
  crashSound();

  if(score > best){
    best = score;
    localStorage.setItem("neonBest", best);
  }

  document.getElementById("finalScore").textContent =
    "SCORE " + score + " · BEST " + best;

  document.getElementById("over").style.display = "flex";
  document.getElementById("controls").style.display = "none";
}

document.getElementById("play").addEventListener("click", startGame);
document.getElementById("again").addEventListener("click", startGame);

let leftPressed = false;
let rightPressed = false;

document.getElementById("left").addEventListener("pointerdown", e => {
  e.preventDefault();
  leftPressed = true;
});

document.getElementById("right").addEventListener("pointerdown", e => {
  e.preventDefault();
  rightPressed = true;
});

addEventListener("pointerup", () => {
  leftPressed = false;
  rightPressed = false;
});

addEventListener("pointercancel", () => {
  leftPressed = false;
  rightPressed = false;
});

addEventListener("keydown", e => {
  if(e.key === "ArrowLeft" || e.key === "a") leftPressed = true;
  if(e.key === "ArrowRight" || e.key === "d") rightPressed = true;
});

addEventListener("keyup", e => {
  if(e.key === "ArrowLeft" || e.key === "a") leftPressed = false;
  if(e.key === "ArrowRight" || e.key === "d") rightPressed = false;
});

document.addEventListener("contextmenu", e => e.preventDefault());

function getAcceleration(){
  // सुरुवातीला खूप हळू, नंतर जास्त वेगाने वाढणार
  if(speed < 6) return 0.018;
  if(speed < 12) return 0.035;
  if(speed < 18) return 0.055;
  return 0.075;
}

function getObstacleGap(){
  // सुरुवातीला अडथळे दूर, नंतर जवळ येतील
  if(score < 100) return 2200;
  if(score < 250) return 1700;
  if(score < 500) return 1300;
  if(score < 900) return 1000;
  return 800;
}

function update(){
  if(!playing) return;

  speed += getAcceleration();
  if(speed > maxSpeed) speed = maxSpeed;

  distance += speed;
  score = Math.floor(distance / 12);

  updateEngineSound();

  if(leftPressed) playerX -= 10;
  if(rightPressed) playerX += 10;

  if(playerX < -320) playerX = -320;
  if(playerX > 320) playerX = 320;

  obstacles.forEach(o => {
    o.z -= speed * 9;

    if(o.z < 100){
      if(Math.abs(o.lane * 260 - playerX) < 110){
        crash();
      }

      o.z = getObstacleGap() + Math.random() * 500;
      o.lane = Math.floor(Math.random() * 3) - 1;
    }
  });

  document.getElementById("score").textContent = "SCORE " + score;
  document.getElementById("best").textContent = "BEST " + best;
  document.getElementById("speed").textContent =
    "SPEED " + Math.floor(speed * 14) + " KM/H";
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,H*0.6);
  sky.addColorStop(0,"#02040a");
  sky.addColorStop(1,"#0d1f3a");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "#fff";

  stars.forEach(s => {
    ctx.globalAlpha = 0.4 + Math.sin(Date.now()/500 + s.x*20)*0.3;
    ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
  });

  ctx.globalAlpha = 1;

  const sunY = H * 0.52;
  const sun = ctx.createLinearGradient(0,sunY-120,0,sunY+120);
  sun.addColorStop(0,"#ff2e88");
  sun.addColorStop(1,"#7b2eff");

  ctx.fillStyle = sun;
  ctx.beginPath();
  ctx.arc(W/2,sunY,110,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#02040a";

  for(let i=0;i<8;i++){
    ctx.fillRect(W/2-120,sunY-100+i*22,240,7);
  }
}

function drawRoad(){
  const horizon = H * 0.55;

  ctx.fillStyle = "#05070d";
  ctx.fillRect(0,horizon,W,H-horizon);

  ctx.strokeStyle = "#00e5ff";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#00e5ff";
  ctx.shadowBlur = 20;

  ctx.beginPath();
  ctx.moveTo(W/2-70,horizon);
  ctx.lineTo(W/2-620,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W/2+70,horizon);
  ctx.lineTo(W/2+620,H);
  ctx.stroke();

  ctx.shadowBlur = 0;

  ctx.fillStyle = "#f7e58a";

  lines.forEach(l => {
    let z = ((l * 2000 + distance * 8) % 2000);
    let scale = 700 / z;
    let y = horizon + (H - horizon) * scale * 0.8;

    if(y < horizon || y > H) return;

    let w = 8 * scale;
    let h = 60 * scale;

    ctx.globalAlpha = Math.min(1,scale);
    ctx.fillRect(W/2 - w/2, y, w, h);
  });

  ctx.globalAlpha = 1;
}

function drawObstacles(){
  const horizon = H * 0.55;

  obstacles
    .slice()
    .sort((a,b) => b.z - a.z)
    .forEach(o => {

      if(o.z < 80) return;

      let scale = 700 / o.z;
      let y = horizon + (H - horizon) * scale * 0.8;
      let x = W/2 + o.lane * 260 * scale;
      let w = 150 * scale;
      let h = 90 * scale;

      if(y > H || w < 4) return;

      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(x - w/2 + 6, y - h + 10, w, h);

      ctx.fillStyle = o.color;
      ctx.shadowColor = o.color;
      ctx.shadowBlur = 25;

      ctx.fillRect(x - w/2, y - h, w, h);
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#fff8c9";
      ctx.fillRect(x - w/2 + w*0.1, y - h + h*0.25, w*0.8, h*0.3);
    });
}

function drawPlayer(){
  const x = W/2 + playerX;
  const y = H - 150;

  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath();
  ctx.ellipse(x,y+55,70,16,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#00e5ff";
  ctx.shadowColor = "#00e5ff";
  ctx.shadowBlur = 35;

  ctx.beginPath();
  ctx.moveTo(x-70,y+40);
  ctx.lineTo(x-45,y-15);
  ctx.lineTo(x+45,y-15);
  ctx.lineTo(x+70,y+40);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle = "#04121c";
  ctx.fillRect(x-42,y-8,84,26);

  ctx.fillStyle = "#7ff4ff";
  ctx.fillRect(x-30,y-4,60,14);

  ctx.fillStyle = "#fff8c9";
  ctx.shadowColor = "#fff8c9";
  ctx.shadowBlur = 25;

  ctx.fillRect(x-58,y+22,18,9);
  ctx.fillRect(x+40,y+22,18,9);

  ctx.shadowBlur = 0;

  ctx.fillStyle = "#ff2e88";
  ctx.fillRect(x-62,y+38,20,7);
  ctx.fillRect(x+42,y+38,20,7);
}

function draw(){
  update();

  drawBackground();
  drawRoad();
  drawObstacles();
  drawPlayer();

  requestAnimationFrame(draw);
}

draw();

})();
</script>

</body>
</html>
