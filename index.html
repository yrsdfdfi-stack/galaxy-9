<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEONFLIX — Watch & Download</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  background:#05060c;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

nav{
  position:sticky;top:0;z-index:100;
  background:#05060cf2;
  backdrop-filter:blur(10px);
  padding:14px 20px;
  border-bottom:1px solid #ffffff10;
}

.logo{
  font-size:24px;font-weight:900;
  color:#ff2e63;
  text-shadow:0 0 15px #ff2e6388;
}

.logo span{color:#00e5ff}

/* CATEGORIES */
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:14px 20px;
  background:#070a12;
  border-bottom:1px solid #ffffff10;
}

.categories::-webkit-scrollbar{display:none}

.cat{
  padding:9px 20px;
  border-radius:30px;
  background:#101a28;
  border:1px solid #ffffff18;
  font-size:14px;
  font-weight:bold;
  color:#c9d6e2;
  cursor:pointer;
  white-space:nowrap;
}

.cat.active{
  background:#00e5ff;
  color:#021018;
  border-color:#00e5ff;
}

/* VIDEO GRID */
main{
  padding:22px 16px 60px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;
}

.card{
  background:#0c1420;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #ffffff12;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#00e5ff66;
}

.thumb{
  position:relative;
  height:110px;
  background:#000;
}

.thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.playIcon{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:44px;height:44px;
  background:#00e5ffcc;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  color:#021018;
  pointer-events:none;
}

.info{
  padding:10px;
}

.info h3{
  font-size:13px;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info p{
  font-size:11px;
  color:#8fa3b5;
  margin-bottom:8px;
}

.rating{color:#ffd166;font-weight:bold}

.download{
  display:block;
  width:100%;
  padding:8px;
  border:none;
  border-radius:9px;
  background:linear-gradient(90deg,#00e5ff,#7cffcb);
  color:#021018;
  font-size:12px;
  font-weight:900;
  text-decoration:none;
  text-align:center;
}

footer{
  padding:35px 20px;
  background:#04050a;
  border-top:1px solid #ffffff10;
  text-align:center;
  color:#7d8fa0;
  font-size:12px;
}
</style>
</head>

<body>

<nav>

<!-- CATEGORIES -->

  <div class="cat active">All</div>

        <a
          class="download"

    <!-- VIDEO 2 -->

      <div class="info">

</main>

<footer>
  <b>NEONFLIX</b><br>
  Watch and download videos.
</footer>

<script>
const cats = document.querySelectorAll(".cat");
const cards = document.querySelectorAll(".card");

cats.forEach(cat => {
  cat.addEventListener("click", () => {

    cats.forEach(c => c.classList.remove("active"));
    cat.classList.add("active");

    const selected = cat.textContent.trim();

    cards.forEach(card => {
      const text = card.innerText;

      if(selected === "All"){
        card.style.display = "block";
      }else{
        card.style.display = text.includes(selected) ? "block" : "none";
      }
    });
  });
});
</script>

</body>
</html>
