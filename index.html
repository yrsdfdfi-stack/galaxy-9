<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON DRIFT 3D</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;background:#02040a;color:#fff;
  font-family:Arial,sans-serif;touch-action:none;
  user-select:none;-webkit-user-select:none;
}

canvas{display:block;width:100vw;height:100dvh;touch-action:none}

#top{
  position:fixed;top:0;left:0;right:0;
  padding:12px 16px;display:flex;
  justify-content:space-between;z-index:10;
  font-weight:bold;text-shadow:0 0 10px #00e5ff;
}

#score{color:#00e5ff;font-size:22px}
#best{color:#ffd166;font-size:15px;text-align:right}

#speedBox{
  position:fixed;top:64px;left:16px;z-index:10;
  background:#04121ecc;
  border:1px solid #1d4a68;
  border-radius:14px;
  padding:10px 14px;
}

#speedText{
  font-size:26px;font-weight:900;color:#7ff4ff;
  text-shadow:0 0 14px #00e5ff;
}

#speedLabel{
  font-size:11px;color:#9db4c9;margin-top:3px;
}

#boostBar{
  width:150px;height:10px;
  background:#0b2233;
  border-radius:20px;
  margin-top:8px;
  overflow:hidden;
}

#boostFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ffd166,#ff7ad9);
}

#start{
  position:fixed;inset:0;z-index:30;
  background:radial-gradient(circle at center,#0b1d33,#02040a);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  text-align:center;padding:24px;
}

#start h1{
  font-size:42px;margin:0;color:#00e5ff;
  text-shadow:0 0 25px #00e5ff,0 0 60px #0077ff;
}

#start p{
  color:#b9d6e8;font-size:15px;line-height:1.6;
  max-width:340px;
}

#play{
  margin-top:26px;padding:16px 44px;
  font-size:20px;font-weight:900;color:#021018;
  background:linear-gradient(90deg,#00e5ff,#7cffcb);
  border:none;border-radius:40px;
  box-shadow:0 0 30px #00e5ff88;
}

#controls{
  position:fixed;bottom:0;left:0;right:0;
  height:210px;display:flex;
  justify-content:space-evenly;align-items:center;
  z-index:20;padding-bottom:24px;
  background:linear-gradient(180deg,transparent,#01050bcc);
}

.cbtn{
  width:150px;height:150px;border-radius:50%;
  font-size:62px;font-weight:bold;color:#fff;
  background:linear-gradient(180deg,#123a5c,#081c2f);
  border:3px solid #2f6d94;
  box-shadow:0 0 30px #00e5ff55;
  touch-action:none;user-select:none;
  -webkit-user-select:none;
}

.cbtn:active{
  background:linear-gradient(180deg,#0a9dbf,#066b85);
  border-color:#7ff4ff;
  transform:scale(0.95);
}

#boost{
  width:170px;height:170px;
  font-size:24px;line-height:1.2;
  background:linear-gradient(180deg,#7b52c4,#3b2270);
  border-color:#c9a4ff;
  box-shadow:0 0 35px #7b52c477;
}

#boost:active{
  background:linear-gradient(180deg,#a86bff,#5b2fa8);
  border-color:#e6c8ff;
}
</style>
</head>

<body>

<div id="top">
  <div id="score">DISTANCE 0 M</div>
  <div id="best">BEST SPEED 0</div>
</div>

<div id="speedBox">
  <div id="speedText">0 KM/H</div>
  <div id="speedLabel">CURRENT SPEED</div>
  <div id="boostBar"><div id="boostFill"></div></div>
</div>

<div id="start">
  <h1>NEON DRIFT 3D</h1>
  <p>
    रस्त्यावर अडथळे नाहीत.<br>
    गाडी सुरुवातीला हळू चालेल,<br>
    नंतर हळूहळू अधिक वेगवान होईल.<br>
    BOOST दाबून जास्त स्पीड काढा!
  </p>
  <button id="play">START ENGINE</button>
</div>

<div id="controls">
  <button class="cbtn" id="left">◀</button>
  <button class="cbtn" id="boost">🔥<br>BOOST</button>
  <button class="cbtn" id="right">▶</button>
</div>

<canvas id="game"></canvas>

<script>
(() => {

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1, 2);

function resize(){
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize", resize);
resize();

let playing = false;
let playerX = 0;
let speed = 0;
let distance = 0;
let bestSpeed = Number(localStorage.getItem("neonBestSpeed") || 0);

let stars = [];
let lines = [];

const normalMaxSpeed = 18;
const boostMaxSpeed = 34;

let boostPower = 100;
let boosting = false;

for(let i=0;i<100;i++){
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.55,
    s: Math.random() * 2 + 0.5
  });
}

for(let i=0;i<45;i++){
  lines.push(i / 45);
}

/* ---------- SOUND ---------- */

let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let engineFilter = null;

function startAudio(){
  if(audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  engineOsc = audioCtx.createOscillator();
  engineOsc.type = "sawtooth";
  engineOsc.frequency.value = 45;

  engineFilter = audioCtx.createBiquadFilter();
  engineFilter.type = "lowpass";
  engineFilter.frequency.value = 600;

  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0.0001;

  engineOsc.connect(engineFilter);
  engineFilter.connect(engineGain);
  engineGain.connect(audioCtx.destination);

  engineOsc.start();
}

function updateEngineSound(){
  if(!audioCtx || !playing) return;

  const freq = 42 + speed * 7;
  const volume = 0.02 + (speed / boostMaxSpeed) * 0.08;

  engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
  engineGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.12);
}

function stopEngineSound(){
  if(!audioCtx || !engineGain) return;
  engineGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1);
}

/* ---------- GAME ---------- */

function startGame(){
  startAudio();

  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  playerX = 0;
  speed = 0;
  distance = 0;
  boostPower = 100;
  boosting = false;
  playing = true;

  document.getElementById("start").style.display = "none";
  document.getElementById("controls").style.display = "flex";
}

document.getElementById("play").addEventListener("click", startGame);

let leftPressed = false;
let rightPressed = false;

document.getElementById("left").addEventListener("pointerdown", e => {
  e.preventDefault();
  leftPressed = true;
});

document.getElementById("right").addEventListener("pointerdown", e => {
  e.preventDefault();
  rightPressed = true;
});

document.getElementById("boost").addEventListener("pointerdown", e => {
  e.preventDefault();

  if(boostPower > 5){
    boosting = true;
  }
});

addEventListener("pointerup", () => {
  leftPressed = false;
  rightPressed = false;
  boosting = false;
});

addEventListener("pointercancel", () => {
  leftPressed = false;
  rightPressed = false;
  boosting = false;
});

addEventListener("keydown", e => {
  if(e.key === "ArrowLeft" || e.key === "a") leftPressed = true;
  if(e.key === "ArrowRight" || e.key === "d") rightPressed = true;
  if(e.key === " ") boosting = true;
});

addEventListener("keyup", e => {
  if(e.key === "ArrowLeft" || e.key === "a") leftPressed = false;
  if(e.key === "ArrowRight" || e.key === "d") rightPressed = false;
  if(e.key === " ") boosting = false;
});

document.addEventListener("contextmenu", e => e.preventDefault());

function getAcceleration(){
  // सुरुवातीला अतिशय हळू, नंतर हळूहळू जास्त
  if(speed < 4) return 0.008;
  if(speed < 8) return 0.016;
  if(speed < 12) return 0.028;
  if(speed < 16) return 0.042;
  return 0.055;
}

function update(){
  if(!playing) return;

  let maxSpeed = boosting ? boostMaxSpeed : normalMaxSpeed;

  if(boosting && boostPower > 0){
    speed += 0.16;
    boostPower -= 0.45;

    if(boostPower <= 0){
      boostPower = 0;
      boosting = false;
    }
  }else{
    speed += getAcceleration();

    if(speed > normalMaxSpeed){
      speed -= 0.06;
    }

    if(boostPower < 100){
      boostPower += 0.12;
    }
  }

  if(speed > maxSpeed){
    speed = maxSpeed;
  }

  distance += speed;
  playerX += (rightPressed ? 7 : 0) - (leftPressed ? 7 : 0);

  if(playerX < -300) playerX = -300;
  if(playerX > 300) playerX = 300;

  if(speed > bestSpeed){
    bestSpeed = speed;
    localStorage.setItem("neonBestSpeed", Math.floor(bestSpeed * 14));
  }

  updateEngineSound();

  document.getElementById("score").textContent =
    "DISTANCE " + Math.floor(distance) + " M";

  document.getElementById("best").textContent =
    "BEST SPEED " + Math.floor(bestSpeed * 14);

  document.getElementById("speedText").textContent =
    Math.floor(speed * 14) + " KM/H";

  document.getElementById("boostFill").style.width = boostPower + "%";
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,H*0.6);
  sky.addColorStop(0,"#02040a");
  sky.addColorStop(1,"#0d1f3a");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "#fff";

  stars.forEach(s => {
    ctx.globalAlpha = 0.4 + Math.sin(Date.now()/500 + s.x*20)*0.3;
    ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
  });

  ctx.globalAlpha = 1;

  const sunY = H * 0.52;
  const sun = ctx.createLinearGradient(0,sunY-120,0,sunY+120);
  sun.addColorStop(0,"#ff2e88");
  sun.addColorStop(1,"#7b2eff");

  ctx.fillStyle = sun;
  ctx.beginPath();
  ctx.arc(W/2,sunY,110,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#02040a";

  for(let i=0;i<8;i++){
    ctx.fillRect(W/2-120,sunY-100+i*22,240,7);
  }
}

function drawRoad(){
  const horizon = H * 0.55;

  ctx.fillStyle = "#05070d";
  ctx.fillRect(0,horizon,W,H-horizon);

  ctx.strokeStyle = "#00e5ff";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#00e5ff";
  ctx.shadowBlur = 20;

  ctx.beginPath();
  ctx.moveTo(W/2-70,horizon);
  ctx.lineTo(W/2-620,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W/2+70,horizon);
  ctx.lineTo(W/2+620,H);
  ctx.stroke();

  ctx.shadowBlur = 0;

  ctx.fillStyle = "#f7e58a";

  lines.forEach(l => {
    let z = ((l * 2000 + distance * 8) % 2000);
    let scale = 700 / z;
    let y = horizon + (H - horizon) * scale * 0.8;

    if(y < horizon || y > H) return;

    let w = 8 * scale;
    let h = 60 * scale;

    ctx.globalAlpha = Math.min(1,scale);
    ctx.fillRect(W/2 - w/2, y, w, h);
  });

  ctx.globalAlpha = 1;

  if(boosting){
    ctx.fillStyle = "rgba(255,122,217,0.18)";
    ctx.fillRect(0,horizon,W,H-horizon);
  }
}

function drawPlayer(){
  const x = W/2 + playerX;
  const y = H - 170;

  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath();
  ctx.ellipse(x,y+55,70,16,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = boosting ? "#ff7ad9" : "#00e5ff";
  ctx.shadowColor = boosting ? "#ff7ad9" : "#00e5ff";
  ctx.shadowBlur = 40;

  ctx.beginPath();
  ctx.moveTo(x-70,y+40);
  ctx.lineTo(x-45,y-15);
  ctx.lineTo(x+45,y-15);
  ctx.lineTo(x+70,y+40);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle = "#04121c";
  ctx.fillRect(x-42,y-8,84,26);

  ctx.fillStyle = "#7ff4ff";
  ctx.fillRect(x-30,y-4,60,14);

  ctx.fillStyle = "#fff8c9";
  ctx.shadowColor = "#fff8c9";
  ctx.shadowBlur = 25;

  ctx.fillRect(x-58,y+22,18,9);
  ctx.fillRect(x+40,y+22,18,9);

  ctx.shadowBlur = 0;

  ctx.fillStyle = boosting ? "#ffd166" : "#ff2e88";
  ctx.fillRect(x-62,y+38,20,7);
  ctx.fillRect(x+42,y+38,20,7);

  if(boosting){
    ctx.fillStyle = "#ff7ad9";
    ctx.shadowColor = "#ff7ad9";
    ctx.shadowBlur = 30;

    ctx.fillRect(x-25,y+48,50,18);
    ctx.shadowBlur = 0;
  }
}

function draw(){
  update();

  drawBackground();
  drawRoad();
  drawPlayer();

  requestAnimationFrame(draw);
}

draw();

})();
</script>

</body>
</html>
