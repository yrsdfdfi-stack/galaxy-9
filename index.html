<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BOMB STRIKE 3D</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;background:#02040a;color:#fff;
  font-family:Arial,sans-serif;touch-action:none;
  user-select:none;-webkit-user-select:none;
}

canvas{display:block;width:100vw;height:100dvh;touch-action:none}

#top{
  position:fixed;top:0;left:0;right:0;
  padding:10px 14px;display:flex;
  justify-content:space-between;z-index:10;
  font-weight:bold;
}

#score{color:#ffd166;font-size:20px}
#ammo{color:#00e5ff;font-size:14px;text-align:right}

#weapons{
  position:fixed;bottom:0;left:0;right:0;
  height:150px;display:flex;
  justify-content:space-evenly;align-items:center;
  z-index:20;padding-bottom:20px;
  background:linear-gradient(180deg,transparent,#01050bd9);
}

.wbtn{
  width:105px;height:105px;border-radius:20px;
  font-size:14px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#1d3a56,#0f2237);
  border:3px solid #2f6d94;
  box-shadow:0 0 20px #00e5ff44;
  touch-action:none;user-select:none;
}

.wbtn.active{
  background:linear-gradient(180deg,#0a9dbf,#066b85);
  border-color:#7ff4ff;
  transform:scale(1.05);
}

#drop{
  width:130px;height:130px;border-radius:50%;
  font-size:20px;font-weight:900;color:#fff;
  background:radial-gradient(circle at 30% 30%,#ff6b81,#a3122c);
  border:4px solid #ffb3c1;
  box-shadow:0 0 30px #ff4d6d88;
}

#drop:active{transform:scale(0.94)}

#start{
  position:fixed;inset:0;z-index:30;
  background:radial-gradient(circle at center,#0b1d33,#02040a);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  text-align:center;padding:24px;
}

#start h1{
  font-size:38px;margin:0;color:#ffd166;
  text-shadow:0 0 25px #ffd166;
}

#start p{
  color:#b9d6e8;font-size:15px;line-height:1.7;
  max-width:340px;
}

#play{
  margin-top:24px;padding:16px 44px;
  font-size:20px;font-weight:900;color:#021018;
  background:linear-gradient(90deg,#ffd166,#ff8fa3);
  border:none;border-radius:40px;
  box-shadow:0 0 30px #ffd16677;
}
</style>
</head>

<body>

<div id="top">
  <div id="score">SCORE 0</div>
  <div id="ammo">💣 10 | 💥 5 | 🚀 2</div>
</div>

<div id="start">
  <h1>BOMB STRIKE</h1>
  <p>
    वरून बॉम्ब टाका.<br>
    💣 छोटा बॉम्ब, 💥 मोठा बॉम्ब,<br>
    🚀 मिसाईल निवडा.<br>
    जास्तीत जास्त targets उडवा!
  </p>
  <button id="play">START MISSION</button>
</div>

<div id="weapons">
  <button class="wbtn active" data-w="small">💣<br>SMALL</button>
  <button id="drop">DROP<br>BOMB</button>
  <button class="wbtn" data-w="big">💥<br>BIG</button>
  <button class="wbtn" data-w="missile">🚀<br>MISSILE</button>
</div>

<canvas id="game"></canvas>

<script>
(() => {

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1, 2);

function resize(){
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize", resize);
resize();

let playing = false;
let score = 0;

let planeX = W/2;
let planeDir = 1;

let weapon = "small";

let ammo = {
  small: 10,
  big: 5,
  missile: 2
};

let bombs = [];
let explosions = [];
let targets = [];

const weaponPower = {
  small: 70,
  big: 130,
  missile: 190
};

const weaponAmmoUse = {
  small: 1,
  big: 1,
  missile: 1
};

function startGame(){
  playing = true;
  score = 0;

  ammo = { small:10, big:5, missile:2 };
  bombs = [];
  explosions = [];
  targets = [];

  for(let i=0;i<14;i++){
    targets.push({
      x: 40 + Math.random() * (W - 80),
      y: H * 0.65 + Math.random() * (H * 0.25),
      r: 14 + Math.random() * 10,
      alive: true
    });
  }

  document.getElementById("start").style.display = "none";
  updateHUD();
}

document.getElementById("play").addEventListener("click", startGame);

/* Weapon selection */
document.querySelectorAll("[data-w]").forEach(btn => {
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();

    weapon = btn.dataset.w;

    document.querySelectorAll("[data-w]").forEach(b =>
      b.classList.remove("active")
    );

    btn.classList.add("active");
  });
});

/* Drop bomb */
document.getElementById("drop").addEventListener("pointerdown", e => {
  e.preventDefault();
  dropBomb();
});

addEventListener("keydown", e => {
  if(e.key === " ") dropBomb();
  if(e.key === "1") selectWeapon("small");
  if(e.key === "2") selectWeapon("big");
  if(e.key === "3") selectWeapon("missile");
});

function selectWeapon(w){
  weapon = w;

  document.querySelectorAll("[data-w]").forEach(b => {
    b.classList.toggle("active", b.dataset.w === w);
  });
}

function dropBomb(){
  if(!playing) return;

  if(ammo[weapon] <= 0) return;

  ammo[weapon]--;

  bombs.push({
    x: planeX,
    y: 90,
    vy: 2,
    type: weapon,
    power: weaponPower[weapon]
  });

  updateHUD();
}

function updateHUD(){
  document.getElementById("score").textContent =
    "SCORE " + score;

  document.getElementById("ammo").textContent =
    "💣 " + ammo.small +
    " | 💥 " + ammo.big +
    " | 🚀 " + ammo.missile;
}

function update(){
  if(!playing) return;

  planeX += planeDir * 2.2;

  if(planeX > W - 60){
    planeX = W - 60;
    planeDir = -1;
  }

  if(planeX < 60){
    planeX = 60;
    planeDir = 1;
  }

  bombs.forEach(b => {
    b.y += b.vy;
    b.vy += 0.18;

    if(b.type === "missile"){
      b.y += 3;
    }

    if(b.y >= H - 40){
      explode(b.x, H - 40, b.power);
      b.dead = true;
    }
  });

  bombs = bombs.filter(b => !b.dead);

  explosions.forEach(e => e.life--);
  explosions = explosions.filter(e => e.life > 0);
}

function explode(x,y,power){
  explosions.push({
    x:x, y:y, r:10, maxR:power, life:30
  });

  targets.forEach(t => {
    if(t.alive){
      const distance = Math.hypot(t.x - x, t.y - y);

      if(distance < power){
        t.alive = false;
        score += 100;
      }
    }
  });

  updateHUD();
}

function draw(){
  update();

  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#050914");
  sky.addColorStop(1,"#101a28");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  /* Ground */
  ctx.fillStyle = "#16222e";
  ctx.fillRect(0,H-40,W,40);

  /* Targets */
  targets.forEach(t => {
    if(!t.alive) return;

    ctx.fillStyle = "#ff4d6d";
    ctx.shadowColor = "#ff4d6d";
    ctx.shadowBlur = 15;

    ctx.beginPath();
    ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText("🎯",t.x,t.y+5);
  });

  /* Plane */
  ctx.fillStyle = "#00e5ff";
  ctx.shadowColor = "#00e5ff";
  ctx.shadowBlur = 25;

  ctx.beginPath();
  ctx.moveTo(planeX-45,80);
  ctx.lineTo(planeX,60);
  ctx.lineTo(planeX+45,80);
  ctx.lineTo(planeX,95);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  /* Bombs */
  bombs.forEach(b => {
    ctx.fillStyle = b.type === "missile" ? "#ff7ad9" : "#ffd166";
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 20;

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.type === "missile" ? 10 : 8,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;
  });

  /* Explosions */
  explosions.forEach(e => {
    const progress = 1 - e.life / 30;
    const radius = e.r + (e.maxR - e.r) * progress;

    ctx.globalAlpha = e.life / 30;

    const gradient = ctx.createRadialGradient(
      e.x,e.y,5,e.x,e.y,radius
    );

    gradient.addColorStop(0,"#fff3b0");
    gradient.addColorStop(0.5,"#ff8c42");
    gradient.addColorStop(1,"#ff2e63");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(e.x,e.y,radius,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(draw);
}

draw();

})();
</script>

</body>
</html>
