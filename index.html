<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON BATTLE 3D</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;background:#000;color:#fff;
  font-family:Arial,sans-serif;touch-action:none;
  user-select:none;-webkit-user-select:none;
}

canvas{display:block;width:100vw;height:100dvh;touch-action:none}

#hud{
  position:fixed;top:10px;left:12px;z-index:10;
  background:#04121ecc;border:1px solid #1d4a68;
  border-radius:14px;padding:10px 14px;
}

#healthBar{
  width:160px;height:12px;background:#251018;
  border-radius:20px;overflow:hidden;margin-top:6px;
}

#healthFill{
  height:100%;width:100%;
  background:linear-gradient(90deg,#ff4d6d,#ff8fa3);
}

#hudText{font-size:14px;font-weight:bold}

#kills{
  position:fixed;top:10px;right:12px;z-index:10;
  background:#04121ecc;border:1px solid #1d4a68;
  border-radius:14px;padding:10px 14px;
  font-size:16px;font-weight:bold;color:#ffd166;
}

#start{
  position:fixed;inset:0;z-index:30;
  background:radial-gradient(circle at center,#0b1d33,#000);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  text-align:center;padding:24px;
}

#start h1{
  font-size:38px;margin:0;color:#00e5ff;
  text-shadow:0 0 25px #00e5ff;
}

#start p{
  color:#b9d6e8;font-size:15px;line-height:1.6;
  max-width:340px;
}

#play{
  margin-top:24px;padding:16px 44px;
  font-size:20px;font-weight:900;color:#021018;
  background:linear-gradient(90deg,#00e5ff,#7cffcb);
  border:none;border-radius:40px;
  box-shadow:0 0 30px #00e5ff88;
}

#over{
  position:fixed;inset:0;z-index:30;display:none;
  background:#000000e0;
  flex-direction:column;justify-content:center;
  align-items:center;text-align:center;
}

#over h1{color:#ff4d6d;font-size:36px;text-shadow:0 0 25px #ff4d6d}
#over p{font-size:18px}

#again{
  margin-top:20px;padding:14px 38px;
  font-size:18px;font-weight:900;color:#021018;
  background:linear-gradient(90deg,#ffd166,#ff8fa3);
  border:none;border-radius:40px;
}

#controls{
  position:fixed;bottom:0;left:0;right:0;
  height:230px;display:none;
  justify-content:space-between;align-items:center;
  z-index:20;padding:0 18px 26px;
  background:linear-gradient(180deg,transparent,#00000099);
}

#movePad{
  display:grid;
  grid-template-columns:repeat(3,95px);
  grid-template-rows:repeat(2,85px);
  gap:8px;
}

.mbtn{
  width:95px;height:85px;border-radius:18px;
  font-size:36px;font-weight:bold;color:#fff;
  background:linear-gradient(180deg,#123a5c,#081c2f);
  border:3px solid #2f6d94;
  box-shadow:0 0 25px #00e5ff44;
  touch-action:none;user-select:none;
}

.mbtn:active{background:#0a7f9d;border-color:#7ff4ff}

.blank{visibility:hidden}

#fire{
  width:170px;height:170px;border-radius:50%;
  font-size:28px;font-weight:900;color:#fff;
  background:radial-gradient(circle at 30% 30%,#ff6b81,#a3122c);
  border:4px solid #ffb3c1;
  box-shadow:0 0 35px #ff4d6d88;
  touch-action:none;user-select:none;
}

#fire:active{transform:scale(0.94)}
</style>
</head>

<body>

<div id="hud">
  <div id="hudText">HEALTH</div>
  <div id="healthBar"><div id="healthFill"></div></div>
</div>

<div id="kills">KILLS 0</div>

<div id="start">
  <h1>NEON BATTLE 3D</h1>
  <p>
    Offline 3D battle game.<br>
    Bots ना शोधून गोळी मारा.<br>
    जास्तीत जास्त kills करा!
  </p>
  <button id="play">START BATTLE</button>
</div>

<div id="over">
  <h1>YOU DIED</h1>
  <p id="finalKills">KILLS 0</p>
  <button id="again">PLAY AGAIN</button>
</div>

<div id="controls">
  <div id="movePad">
    <button class="mbtn blank">.</button>
    <button class="mbtn" id="up">▲</button>
    <button class="mbtn blank">.</button>

    <button class="mbtn" id="left">◀</button>
    <button class="mbtn" id="down">▼</button>
    <button class="mbtn" id="right">▶</button>
  </div>

  <button id="fire">🔥<br>FIRE</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
